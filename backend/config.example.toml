# AI Code Reviewer 配置示例
#
# 只支持两种大模型调用协议：
# - openai: 适用于所有兼容 OpenAI API 的服务（OpenAI、智谱、通义千问、DeepSeek、各类中转站）
# - anthropic: 适用于 Anthropic Claude 系列

[llm_config]
provider = "openai"                                    # openai | anthropic
base_url = "https://api.openai.com/v1"                 # API 基础地址（OpenAI 兼容服务填对应地址）
model_name = "gpt-4o-mini"                             # 模型名称
api_key = "CHANGEME"                                   # API Key

[gitlab]
url = "https://gitlab.example.com"
private_token = "CHANGEME"

[rules]
default_prompt = '''
你是一个高级代码审查安全专家。
请仔细审查以下代码变更，评估是否有任何潜在的安全风险或隐患。
重点关注：
1. SQL 注入预警
2. XSS (跨站脚本攻击)
3. 越权风险
4. 硬编码密钥或敏感信息
5. 严重的业务逻辑缺陷与拼写错误

请将你的建议组织成清晰的 Markdown 格式，指明具体的代码行号和改进方案。如果没有风险，请同样明确告知无风险。
'''
